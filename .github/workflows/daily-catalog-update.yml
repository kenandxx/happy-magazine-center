name: Daily Catalog Auto-Update

on:
  schedule:
    # Runs every day at 07:00 JST (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: npm test

      - name: Fetch daily catalog updates (no-login public sources + optional Rakuten OpenAPI 2026)
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_ALLOWED_ORIGIN: ${{ secrets.RAKUTEN_ALLOWED_ORIGIN }}
        run: node scripts/fetch-catalog.mjs --update

      - name: Validate catalog policy & image integrity
        run: node scripts/validate-catalog.mjs

      - name: Commit and push if catalog changed
        run: |
          if git diff --quiet data/catalog.json; then
            echo "No changes to data/catalog.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "chore(catalog): daily auto-update $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
